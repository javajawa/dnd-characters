      - summary: "Session 64"
        sessions: [ 64 ]
        start: 18th Leaffall
        end: 18th Leaffall
        location: TODO
        story: |
          We approach the room with the eye ball friend, ready to immediately
          betray Mormesk (and at least hear the Beholder-kin's side of the story).

          Bram knocks and then opens the door to a large workshop, damage
          by the ancient spell battles that laid last to the mine.
          The corners have two workbenches, with the plaster burnt off the walls
          from the fighting. The brazier in the center of the room is lit with a
          purple flame, seemingly untouched by the other damage.

          The beholder-kin is 4ft in diameters with with 4 eye stalks; it blinks
          twice and we hear psychically "are you new?". It is very surprised to
          see non-known non-employees in the mine. Bram attempts to negotiate
          passage, and we learn that it was summoned and employed by Mormesk to
          guard the vault.

          This seems like a classic case of automaton sticking to the orders.
          This poor thing has been bound here for hundreds of years, unable
          to leave the room, unable to be released.

          > "I like this better than blindly attacking the Beholder-kin, because
          > it's adorable".

          We return to Mormesk and ask if we can change the task parameters slightly,
          and get told that we are not following orders correctly. Negotiations
          take a turn for the worse as the blue spectral robes, the return of the
          shaking bones, and so forth. Bram eventually explicitly defies an order,
          he [does something dramatic that randus hasn't said yet because missing tokens]
          and combat begins.

          Bram leads with a chaos ball, which picks fire and does absolutely nothing.
          We've got self-assembling skeletons popping up, which Gundren webs up.
          The first hostile round is giant hot fireball, which isn't great for us.
          Also the skeletons keep popping up, and the ones hit by his fireball get
          their life force absorbed into him.
          The battle gets cut slightly short by a crit-divine-smite for around 40
          damage. Yay Bram!

          Inside the room is a poison brazier, which is easily lit. The rest of the
          room contains some money and some misc items.

          Back up in the beholder room, we find a tear in reality steadily sealing
          itself where the beholder-kin returned to the far realms. Lash is able
          to reassemble his smith's tools, and also put together a thieves

          > "Any non-magical weapon / armor bathed in the fire of an elemental brazier
          > will obtain certain properties"

          We are able to reason out that the brazier in this room is likely the
          lightning, and that behind the barrier there is a good chance there's
          a radiant one.

          We decide to go check on the barrier status. On the way back we see
          more piles of bone and ash, presumably dead since Mormesk was put down.
          As we arrive back to the barrier we find it to be flickering.
          We realise that this barrier has been here the entire time -- the control
          braziers are split between the spider-controlled and undead-controlled
          areas.

          As we loop back to the door, we see light coming from the doorway -- it's
          been opened, so the ritual is probably over. The people might still be
          there, waiting, or they might have already left the cave altogether.

      - summary: "Session 65"
        sessions: [ 65 ]
        start: 18th Leaffall
        end: 18th Leaffall
        location: TODO
        story: |
          We approach the doored area in a pincer movement, with the door side
          bring lead with a silent image.

          The silent image doesn't draw and attention, and Lash approaches the door.
          The room is adorned with 6 cracked and splintered marble pillars,
          and centered with a 9ft statue of dwarf on throne baring a mighty
          stone war-hammer in his hands, and make with large emeralds for eyes.
          The eyes are seemingly melting, possible cased by the ritual that
          has been happening.

          The room's recent activity consists of dust and debris being moved away,
          a rough firepit in front of the statue. Either side of it is a dead body
          with it's own pool of blood (species not identified).
          To one side is a wooden table with a variety of tooling, and two prisoners
          in cages -- one "goblin" like thing, one black haired dwarf.

          Inside, we are met with a drow, who announces that *someone* has ascended.
          Combat ensures. Including liquid gem self immolation shadow cutie summoning.
          The dwarf seems to teleport out of their cage to crit Bram, changing back
          in form to a Dopplegänger; Gundren is saved the horror of seeing a fake
          brother. Glint misty steps in to heal Bram.

          Following some basic stabbing, fighting, etc., Gundren uses web to restrain
          them, Glint uses Faerie Fire, and we generally pin down the drow Onyx and
          the doppelganger. Combat is resolved quickly and stabbily after that.

          What remains is two fresh webbed corpses, two bugbear corpses, the goblin-like
          prisoner, and a mysterious locked door. The statue's eyes, which appear to
          have been melted with acidic like substance, were likely worth five thousand
          gold pieces each.

          Behind the door is a unconscious red-headed dwarf (sleep magicked) who is
          confirmed to be Grudren's brother. This is resolved by the way of a water
          dumping, and then a lot of confusion over who we are, why the slime claims
          to be his brother, and so forth.

          On the table are maps, documents, and a sack with
          225gp, 15pp, 9 smol gemstones, dwarven sized electrum ale mug,
          three empty Simic vials.

          We haven't been able to make much head way on who the ascended one.
          Onyx has little more than her cloak and dagger.
          The piece of body pieces in the corner turns out to be some blending
          of something of drow lineage, and bits of a giant scorpion (which is
          likely how they consumed the emeralds for use in the spell).

          The ascended lord is likely a Scorpion-Drider.
          In normal drow culture, being made a drider is a punishment, but in
          this case it seems like it was an intentional goal; this group may
          well be a group of half-breeds and other outcasts.

      - summary: "Session 66"
        sessions: [ 66 ]
        start: 19th Leaffall
        end: 19th Leaffall
        location: TODO
        story: |
          Before turning in for the night, Lashyn attempts to enchant his glaive
          in the radiant brazier -- it works, but has already worn off by the time
          the long rest to level 8 is completed.

          Tik-Garn has been replaced! With a Drow named Arendiau Lendarine who
          originated in Menzoberranzan and is now affiliated with the Azorious.
          She, like most of that party, is a young adult by the standards of her
          race. The party, surprisingly/disappointingly, doesn't actually know
          much about Menzoberranzan such as the fact that it's nearby.

          Bram is the one to questions -- do you work with the black spider
          (which it turns out is a common label given to Lloth's disciples
          sent to the over world to help usher in her dominance of the plane.
          She says (truthfully?) that she has not worked with an drow since
          she was blamed for the failure of her elder brother and sister,
          then being thrown to Ravnica whence she has been trying to escape/return.
          Arendiau shows off her ability as one of the gifted scions (soulknife
          rogue).

          She asks us what we're doing (and where we are). Neverwinter is a useful
          reference point geographically, but our reason for being in the cave
          network is somewhat scuppered by the fact our "dwarves" have disappeared
          during the night (with excellent stealth rolls).

          We finish getting up and go looking for them.
          Glint breaks off to do cast growing magic on the mushroom zone (which will
          take 8 hours), and Landan checks in on the statue for signs of any
          remaining of divine blessing (presumably as part of the anti-lycanthropy
          thing) -- it does not.

          The rest of the party catch up with the dwarves looking over the main
          machinery of the spell forge -- the part that stabilises and seals the
          enchantment into the weapon. They are horribly uncoordinated in what they
          are currently trying to, both in terms of understanding the device, and
          what they are currently able to achieve. Some examining of the rune work
          shows bit of stabilisation of magic energies, a la magic weapon.
          Lashyn makes some coordinating comments, gives over the sketch map,
          points out the power system, and then encourages everyone to head off to The Vault.

          The vault has a triple entry system that requires hands from all three of
          the founding races of the project -- gnome, dwarf, and human. The door is
          opened by Gundren (doing a gnome impression), Nundro, and Lash. A magical
          backlash warms the hand and incapacitates Gundren, who after one minute
          returns with a brain beamed full of knowledge of how the spell forge works.

          The vault is filled with storage racks with various pieces of armour, weapons,
          and associated documentation on how well they took to the magic. Faelar uses
          detect magic to find three magic items -- Lightbringer, a mace dedicated to
          Lathander; Dragonguard, some anti-dragon medium armour; and a shard of the
          Artblade (Ary'Faern'Kerym). This void-like shard is part of a mythical weapon
          meant to be wielded by a strong mage of the elven kingdom, and it is what
          Faelar has been looking for.

          We spend a couple of hours emptying out the vault (as the dwarves will not
          have access to a human). The door self-locks every hour, and this allows both
          Lashyn and Landan to gain the knowledge of the workings of the forge (including
          operation knowledge, such as the contract for the beholder being 101 years long).
          Lashyn offers to return to the cave and be a smith for a bit once the whole
          dragon thing is sorted. Gundren gives the party a letter to take back to
          Silidar.

          The party heads down to the mushroom area to pick up Glint; Bram has the foresight
          to notice that the fungal guards are also plants and are going to be effected
          by this spell...and we manage to run away from the giant violet fungi who
          begin absorbing all the nearby bones and becoming exciting large.

          We return to the southern rooms where Arendiau fails to open it by the way of
          the lock pick, so Faelar breaks out knock. Inside is just a pile of cash.
          Useles worthless cash. Neither goods nor services.

          Landan stops at Kella's body to cast Speak With Dead, but it fails, presumably
          as it has already been cast on her (by the big orc cleric). We inform Silidar
          by sending of the situation and (semi-against orders) pack Kella's body for
          later interrogation.

          With that all done, we head back to Phandalin arriving in the mid evening;
          we wave to our garden-tending Gnome (who it is determined has a blue cap)
          and head inside to talk to Sildar. Passing through the common room we find
          a new baby-adult doing some cleaning; he radiates a complete lack of
          confidence or competency and is confused by more people arriving after dinner.
          We proceed to interrupt Silidar's nap (though it was taken in part, we are
          lead to believe, because he was expecting some visitors namely ourselves).
          After some poor communication we get Gundren's request for security handed
          over to Silidar, who calls for Bennie to get a messenger ready to head to
          Neverwinter (which isn't going to happen this time of night).
          There is also a very guarded letter from Sister Graelae.

          Our plan, on the morrow, is to head out towards the Tower of Storms to
          attack Sparkbringer; Landan however will split off and return to Crystella's
          corpse to ensure that gentle repose is maintained.

          To round out the evening is Faelar's sotry time telling us about the Artblade.
          The story starts in the forest Cormanthor (to the east of Faerun) 5,000 years ago.
          In the elven city Myth Drannor three magical elven blades were forged and
          enchanted: the Ruler's Blade (associated with the current king), the Warblade
          and the Artblade ("art" here being "magic"). The Artblade was once wielded
          by an ancestor of Faelar's, called Josidiah. The blades have the ability to
          judge the worthiness (and elfiness) of their wielders.
          In the year 711 in the Faerunian Reckoning, an army of darkness attacked
          and destroyed the city; and the three blades were lost.
          Now Faelar has recovered a shard, one of [many], and is working to reassemble it
          for #reasons.

          Glint has many very very relevant questions. Like can we go grab the
          sword that makes her king.

  - title: Storming The Tower
    scenes:
      - summary: "Session 67"
        sessions: [ 67 ]
        start: 20th Leaffall
        end: 20th Leaffall
        location: TODO
        story: |
          It's dream time for Glint -- Bael brings her some magical thieves tools,
          with the built in capability to steal dragon fangs. It also comes with a
          task to extract a dragon fang from each kind of dragon. She zooms off
          without giving Glint a high five, pausing to make sure that Glint knows
          she's being left hanging.

          Landan heads out early, leaving the campaign (possibly taking Kella's
          corpse with them) as they head to stand vigil over Crystella's corpse.

          A lot of the rest of the session was a morning shopping trip, starting
          with heading over to Mirna's Herbalism shop. The wolfsbane is successfully
          processed and we have acquired all of the required components for the
          potions (after handing over a bunch of money for the general ingredients).
          Those potions will take some time to brew, but they're now in work.

          Sadly neither Mirna nor Adabra have the ingredients for resistence potions;
          turns out to make them, you first need to kill something which can produce
          a lot of the element to reduce the essence.
          We do however pick up a number of extra healing potions.

          Meanwhile, Faelar checks in with Sister Graelae's house, which has remained
          undisturbed. I believe that there was no new message to pick up. What there
          was was a very confused Tik-Garn. He had enough time to be debriefed by the
          Boros back on Ravnica, and now finds himself back in Faerun once more.
          Unknown to the party, the Izzet made ring that makes this inter-planar
          travel possible is controllable by both Tik-Garn and Arendiau (though only
          Arendiau has worked out how so far), and those rings seem to be slowly
          merging with their flesh.

          Faelar does get to see the swap happen, with Arendiau returning from a
          brief stint on Ravnica (prehaps for the better range of breakfast items
          and access to coffee). She refuses to comment on if she has control.

          Back at the base, Bennie is failing to find Silidar byt running around
          shouting. Silidar is expecting him to recall his routine and thus predict
          where he will be both. Both of them are terrible, and Glint ends up helping
          by just getting them to not annoy each other for all of a minute.

          With the chores done, we head up to the inn where Nilsa is getting more
          concerned about the lack of food and general traffic making its way down
          the Triboar trail. She's excited to here that Sparkbringer is next on our
          list of priorities (especially as her first impression of Lashyn is him
          arriving having walked a _long_ way to do this).

          We head off in the mid-morning up the road to the main Triboar trail,
          which is entirely deserted -- not just of travellers, but of the background
          sounds of animals. No threats emerge on the road down to the Cragmaw Hideout,
          where Yeemik's band is steadily growing in numbers and strength.

          The goblin band are also having difficulty acquiring food, and are having
          to send hunting parties into the forest. They have the advantage of knowing
          why the wildlife has fled, which was a brief and decisive fight between
          Cryovain and Sparkbringer, which has functionally banished Sparkbringer
          back to the Tower of Storms. The after effects of that confrontation will
          ripple for a while yet.

          Whilst we're there (and Yeemik is struggling with his new mechanical arm)
          a runner comes in and reports that the kobold Drippingfang has been seen
          accompanying a group of Grung towards Venomfang's occupied forestry area.
          The Grung are poison excreting an aquatic species from Chult with a
          slaver culture. This adds to our list of known problems.

          Also a new problem that is...possibly actually the runner, and I'm
          getting confused, but there is also a bunch of black robed individuals
          heading North from Leilon wearing amalgamated Cult of the Dragon +
          Cult of Talos masks (so a dragon face with three lightning bolts on it).

          Having caught up with Yeemik, we push on into the evening and arrive
          at the Wayside Inn at the head of the Triboar Trail. As we approach the
          sending stone warms and Faelar hears Bennie screaming that Cyrovain
          has hit Phandalin.

      - summary: "Session 68"
        sessions: [ 68 ]
        start: 20th Leaffall, Evening
        end: 20th Leaffall, Evening
        location: TODO
        story: |
          We resume with Faelar responding to Bennie's message of Cryovain's attack,
          instructing him to hide and wait until she's gone before trying to help people.
          Who knows what damage we will see upon our return, but we are a long way out
          of range to offer help.

          We step into the inn's courtyard, which is void of horses but does contain
          some like of large mechanical device, bearing two wheels and a lot of metal.
          Glint and Lashyn do manage to reason out it is likely some magical powered
          method of transportation, but little more. Lash suggests to Glint that if
          she wants to know more, she will have to speak with the owner (who might be
          inside). As she turns to head in, she spots Basil through the window, and
          her excitement only increases.

          On the inside we see Backes, the bar man, and a singer on the stand.
          Out of site around the corner is a third person (who might be staff
          or a customer...Lash doesn't know either way, on account of not having
          been here before, but the party might recognise her).
          The owner, Martricia, is not currently around.

          The only customers we can see are Basil, a tiny fey dragon on his shoulder
          (Watkins, polymorphed), and the bugbear he is talking to. Glint rushes over
          to catch up with them and is introduced to Dom.
          Dom is a delivery driver and the owner of the 'motorcycle', known as the
          'Devil's Ride'.

          Faelar approached the bar to sort out food and lodging; we book the two
          group rooms for 4 gold pieces (notably overpriced), and the money goes into
          Backes' pocket rather than any kind of till (which might be normal?).
          The kitchen is, however, already closed -- information that causes Basil
          to perk up and start heading down to poke his head through the kitchen door.

          Faelar decides to ask Backes (barkeep) where Martricia currently is -- apparently
          the place was sold to Backes a number of ten days back, notably before we
          were last her and talked to her. This is where the threads that something
          is wrong here are coming together; although Backes backtracks and claims it
          must have been last week that Martricia left to Neverwinter, the space feels
          weird.

          Basil takes the opportunity to go looking through the Kitchen; Unbeknownst 
          to use, he is looking for Tiga, the blacksmith we met last we were here.
          We're not sure why Basil believe the kitchen is the place to look, but opening
          the door he sees nothing (except maybe a pool of blood?), but does get a
          firm reprimand from Backes. Combat does not ensue, but we learn a couple
          more things: the entertainer was ready to join any fight, and Backes is
          strong enough to not even notice Faelar trying to slow him down when reaching
          for his spear.

          Tensions drop slightly as Basil returns to his seat; Arendiau joins them to
          introduce herself, with Basil being the first drow she has met in many a year
          (even if it is a puny male). Basil is completely lost by every part of her
          introduction, except maybe the concept of Menzoberranzan; this allows us to
          learn that although Basil has been a surface walker for a lot of his life,
          he was born in the Underdark. Faelar continues questioning Backes, until
          Lash interrupts him by acquiring a pint of mediocre mead (there being no
          "best beer" available).

          Around this time, Dom departs to complete his delivery before midnight
          (I wonder where he can get to in 3-4 hours with the bike?), and Basil tries
          to explain to Glint (and other party members near by) that this is not a
          safe place to talk because likely cultists. This explanation goes terribly
          the first few attempts. Lashyn, having not arrived with the party previously
          and feeling something is wrong, sits nearby but not at the same table, facing
          to be able to see all three non-party members (with some difficultly), and
          sipping his drink.

          Eventually the party decides to retire to the rooms to discuss the matters
          of the day. Watkins goes invisible to stay behind and see what is discussed
          in our absence; as the party steps out the door, a tip demand from the
          entertainer leads to a tossed gold piece and her fumbling (briefly) a
          porcelain mask she is carrying. Lashyn remains at his table, pretending he
          is not attached to the party, and slowly getting through his pint.

          After we're out the door, it turns out that Watkins' invisibility is not
          enough and he is trapped under a bucket on the counter by Brackes.
          When he fails to slip back outside after a minute (length of greater
          invisibility), Basil starts to get worried about what is going on inside.
          Glint uses telepathy to ask Lash if he can see Watkins, a question that
          ability does not allow him to answer. However, he was aware of some rattling
          in the bucket, and is able to put two and two together.

          Now in a room with three potential hostiles and at most one potential
          ally, Lash is looking for a solution that where the failure mode is him
          being thrown out the door rather than dead. Draining the rest of his
          mead, he fakes a state of drunkenness and stumbles back to the bar,
          aiming to knock the bucket off the counter and give Watkins a chance
          to fly away. This leads to the (re)discovery that Brackes is unreasonably
          strong.

          To make things worse, Lash was not thrown out, but carefully taken to
          the private bedrooms upstairs, where he...allows the lady (who might be
          staff?) to remove his armour (which Lashyn is surprised she knows how to
          do) and then confiscate this weapons (which Lashyn was not intending to
          let happen). In this he gets a very limited idea of who this woman is,
          except that the figure he sees is an illusion -- in the most Kitteh way
          possible, the chest visual does not match what is pushed against him.
          Not knowing how strong this opponent is, and denied even a dagger, he
          lets himself be settled towards sleep.

          Outside, the party is milling around not really aware what is going on.
          After Lash fails to return with Watkins after a few minutes, Basil steps
          back in (with various people in support) and asks Backes if he had seen
          Watkins, even trying to go for a little bribe. All knowledge of the
          situation is denied outright, along with any information about Tiga.

          Deciding to fall back and regroup (and see if they can work out where
          Lashyn ended up -- something the party notably didn't ask about).
          As they proceeded up to the group rooms, concerning noises are heard coming
          from the inner stable areas; on closer investigation, we find two ponies
          eating the corpse of a third, using...actions that do not match their
          physiology, as if they had mouths in their chests.

          Basil, on seeing this, attempts to back out and avoid more chaos by closing
          the barn doors. He rushes to check a different door, finding a pig pen full
          only of blood. Seconds later (around the time that Lash had been disarmed),
          the "ponies" break through the doors to lash out at the party, finally
          bringing enough noise to stop the sub-par entertainers performance, and the
          chaos of combat to fully begin.

          The first large revelation of this combat is that Bram stumbled upon the
          best sword for the job, having drawn the dragon slayer sword. As we all
          know, ponies are actually dragon-kin. 100% well known fact.
          Upon killing one, it starts looking like a tiny wingless blue dragon --
          likely some kind of drake.

          The staff, on the other hand, are much scarier. They have a ranged lightning
          multi-attack, which brings Arendiau down and bloodies Bram quickly. On being
          got back up by Lay on Hoof, Arendiau casts darkness to slow the exit from
          the inn and give us more time to get things together. Bram gets hasted by
          Faelar; the party gets blessed by Glint; and the final chaos ball is resolved
          into a fireball for some amount of damage. The hostiles are slowed a lot
          by tripping over each other, and at least one case of friendly-stab happens
          in the darkness.

          Upstairs, Lash hears what is going on and goes to grab his shield (there's
          no time for getting armour back on) and promptly finds himself locked in
          the room; it takes until the second round to get out the door, and to the
          fourth to be able to see his weapons at the bottom of the stares. He grabs
          the Storm Axe with the plan to engage more at range, but the first visible
          target turns out to be a prone cultist in the entry corridor.

          The session ends still in combat, with all three of the inn members up,
          but I believe both of the 'ponies' downed. Watkins may have been able to
          break free in the mean time, and the party is currently all on their feet.

