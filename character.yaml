          to attacking Falcon's lodge, the destroyed bridges, and a religious
          experience leading to the image of a boar.

          [!https://cdn.discordapp.com/attachments/969993077638971442/1221140419086258217/636960495200331563.png?ex=66117ea3&is=65ff09a3&hm=b0ea9168265abb0c42b8e4222bd45c3a0ff8f3a8ba6afa196bcf68747392178a&]

          Yes. Yes! The Fire is out!
          Glint takes the map to the more intelligent part of the party;
          Faelar sees the pig, Basil does not (adding to the list of things
          that Basil finds as different/odd about us).

          We are interrupted by a lightning strike. Is there a new perma-storm
          forming? That's what Light suspects. The party groups back up, realise
          we haven't cleared the rooms to the South. Basil finds a studio room
          (combined bed, kitchen, lounge) with the smells of bad cooking now
          released.

          There's a lot of doubled doors in this place.

          We continue doing the stealthy exploring and find lots of door that
          are not locked or trapped and are generally empty.

          We then begin to climb the stairs...which were prepared to collapse
          into a pit trap. Bram makes it across as the stairs collapse.
          As they don't respond, Light deploys the rope of climbing and also attempts
          to make the leap, successfully embedding themselves in the wall.
          Combat against a large number of tiny flying bloodsuckers begins,
          and ends via a Tik-Garn moonbeam blasting them all before the squishies
          make it up the stairs.

          Basil finds a long narrow corridor behind a door, with another door at
          the end with noise behind it...the door is opened remotely by mage hand,
          and the lightning bolt and javelins come down the corridor, with the former
          scoring a couple of hits. Light then attempts to follow through on Basil's
          plan for making them come to us by deploying the Void Orb at the end of
          the corridor, giving us time to setup and forcing them into the chokepoint.
          Faelar is able to get the fireball on the flank, and the left side of the
          opposing for goes down. The survivors charge the darkness and get a series
          of reaction attacks as their reward. Combat is cleared with actually a
          negative amount of HP usage and some wonderful bonfire placement. The final
          orc jumps out a window to their death (shot by Basil in the process),
          and gets eaten by the tree.

      - summary: "Session 48"
        sessions: [ 48 ]
        start: 9th Leaffall
        end: 9th Leaffall
        location: TODO
        story: |
          We proceed down the corridor to the room the orcs were holed up in.
          Fine furniture has been destroyed, the place is a mess, and the hole back
          down to the ground floor is present. There's little of interest in the room
          (a whetstone the only hint to a usage).

          The giant pile of vampire mosquito majigs is cleared using Landan's telekenesis,
          revealing the balcony which we in character knew about (but players had long
          since forgotten).
          The room in the upper west wing is a bedroom, with an elegant carved
          mantle-piece above the fireplace. How classy!

          Glint sees magic in the mantle-piece, and locates a fancy birb-engraved staff!
          The cabinet contains no papers or other interesting things; like the other
          rooms it feels abandoned (despite people clearly having been present for a
          while recently).
          The wardrobe a walk in, and with a fancy (magical) Cloak of Billowing
          and a chest with...charred feet. (did I hear that right?).
          The chest is opened whilst Kitteh is getting food and contains an immovable rod.
          The hidden door is hard to locate -- Faelar is able to find where it
          physically is but now how to release it.

          Landan spots something moving in the tree line, attempts to scare anything
          out with a frost bolt (to no obvious effect). What is spotted is that the
          boars are no longer entranced and are (likely) hostile.

          Whilst Basil (followed by Glint) zoom off to find the other side of
          the missing secret door, Light and Faelar take advantage of the balcony
          to try and scare off the boars in the area. This works in so far as the
          one boar in line of sight is deadified, *and* Light spots what Landan
          was reacting to: a Tree Blight lumbering towards us.

          Basil locates the secret door with the very traditional pull-book-to-open
          system up the spiral stairway located in the library.

          Light calls out the tree blight, and Faelar sends out Thena to check for
          more information and to check to see if there are others incoming.
          As Thena approaches, they encounter Needle Blight based flak and are...
          unsummoned. At least 5 needle blights are catching a ride on this tree
          blight.

          With this all a couple of minutes away from you the idea of leaving is raised.
          Neither Light nor Tik-Garn are going to abandon this position willingly.
          Light's current line of thinking is that it has been recalled to to defend the
          gulthias tree, and there might be more converging on us (with Light being
          concerned that our lines of retreat will be blocked). The alternative that
          is it fleeing from Cyrovain's attack on the hunting lodge (after being posted
          nearby as part of the assault plans found on the ritual-leader half-orc)
          does not occur to anyone.

          Tik-Garn doesn't feel that retreating is the best option. In general. Ever. #boros

          Instead being prep work for a fight begins. Light semi-commits the party
          unilaterally by casting Spike Growth by the entrance, and Bram successfully
          makes the leap downstairs. At some point in this process, a boar _winks_
          at the party members on the balcony (nothing to be alarmed about there).
          Lo, the party take up positions to defend against what is assumed to be
          a vengeful blight coming to defend the tree that spawned it.

