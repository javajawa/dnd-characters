  - title: Wave Echo Cave
    scenes:
      - summary: "Session 57"
        sessions: [ 57 ]
        start: 18th Leaffall
        end: 18th Leaffall
        location: TODO
        story: |
          We finally set off for Wave Echo cave, and ask Gundren for any extra information
          about the place. Primarily it's just at the top of a cliff top access path,
          and not very well explored. The shipment he was originally travelling with
          contained a lot of explosives to get out of the first chamber and start exploring
          properly.
          The most concerning piece of information is that the cave has a heart-beat
          like quality, faint at the entrance but getting louder inside.

          Upon arrival, there are signs of recent heavy travel in the area, indicating
          a lot of new arrivals. On reaching the entrance proper, Landan uses Arcane
          Eye to scout the entrance way. It finds several dozen bodies -- humanoid,
          all in black cloaks, against bugbear, etc. Around the entrance is a 20 ft deep cliff/hole.
          Deeper inside are "dark shapes" stuck to the ceiling.

          Something resembling an original entrance is located, implying possibly
          a large explosion.
          Much deeper in the eye locates a stream with a bunch of bugbears searching
          it, and there's also a barrier against against scrying and eavesdropping.
          Other rooms start showing the signs of machinery -- waterwheels, bellows,
          and a smelter, adorned with Dwarven zombies, led by a flaming skull.

          There's also a moss and fungus room, with green phosphorescence, complete
          with two fungus-based plant like creatures.

          Overall: Lots of different chambers on the east, big chamber in the middle.
          There's four areas we could check for the brothers. At least on confirmed
          dead, around the entrance way battle but prior to it taking place.
          The black cloaked figures might have been led by Kella, against the bugbears,
          assumed on the grounds that her body appears to be present.

          The other interesting body is a drow with a spider tattoo, a glass hand-axe,
          and another messy body.

          The warded area is to the North West which might but unlikely be survivor,
          there's the main central chamber, the Eastern chambers.

          We message Silidar to mention Kella, and he is surprised she is here.
          As we head in, Lashyn is the first to identify the black cloaked people
          are Zhentarim. There's a lot of bodies in here...
          We set up two anchored ropes to head down.

          The collapsed section of the chamber which forms the entrance to the
          complex proper contains the body of the dwarf, and a large number of
          supplies on the other side.
          The deceased brother Tharden has been dead for a week, and has a cloak
          of protection that Gundren takes.
          The dead male drow has the glass hand axe embedded in his back, which
          might be the true indication of the in-fighting that Silidar posited.
          The investigation indicates he was caught by someone he trusted,
          (we posit it might be the person who was making the weapons).
          The axe was last seen being wielded by the drow pretending to be Thal
          the lumberjack.

          The other person in this area is apparently one of the bodies that
          disappeared after we "killed" it.

