          - Lashyn gets to share in the memory of the red wizard giving an item to a kobold with a spear -- he picks up a crown which causes him to age to death, and the kobold gets away with it.
          - The crown seems to have been made from Chardalyn, a magic absorbing rock.

      - summary: "Session 55"
        sessions: [ 55 ]
        start: 13th/14th Leaffall
        end: 13th/14th Leaffall
        location: TODO
        story: |
          Our combat against the undead horde continues, with a large number of flubbed rolls.

          - Combat continues
          - The staff uses another Cone of Cold getting Bram down to 1hp
          - Lash's first 4 d20 rolls are 19/1/19/20
          - ...we are looking worse for wear. Lash has taken more damage then most of the party have HP
          - We see a new trick out of Landan in the form of Aura of Vitality (except we don't because that gets rolled back for reasons).
          - Bram goes down briefly to one of the zombie orcs, which are hitting like actual trucks.
          - We determine that radiant damage is kind of needed to get the zombies down.
          - Glint saves the day -- we're all very beat up by the time this combat is over.

          - Faelar reads the note in draconic which aligns with what Lashyn has already seen.
          - We determine Frigidfang was the one to take the crown, whilst the red wizard died to the trap
          - Chardalyn can be endowed with magical from both higher and lower effect, and can corrupt the carrier towards that plane.
            As weapons it is stronger than steel.
            In Icewind Dale a large Netheresene item was destroyed about 100 years ago scattering chunks of Chardalyn in the area.
          - The party is here because the rumours of undead, and had discovered that it was previously a Netheresene outpost, potentially with associated lich.

          > In the days of the Netherese, the powerful Wizard Arthindol set out to expand his reign of terror.
          > In 1 such push he slaughtered thousands of Owlbears of all ages and sizes with a single spell.
          > He then ordered a watch tower and an outpost were travelers coming to swear fealty to him could
          > restock supplies be built on the site.
          > But rumor tells of a much more sinister plot having his minions dig a hole 5 miles down to
          > bury some great and powerful weapon that he could call upon whenever needed.

          > According to Netherese Logs said to be found East of the Weathercote Woods,
          > the exact number of buried owlbears was slightly more than 3000.
          > Given his final fate roaming the ancient ruins of Oreme,
          > I can only assume what was actually buried was his phylactery and maybe
          > the secret rituals he followed to take his current form.

          - We notice that the room is only partially dug out -- they got here pretty efficiently
            and made a beeline for the chest (above table turns out there were directions that we burnt in Thundertree)
          - Glint searches the boxes, finding lots of bits of archeology, including a non-metallic ritual dagger.
            Lashyn gets to describe it. Kitteh was not there for this.
          - We decide to loot the crates, despite some objections (and Lashyn's feeling we should just seal this place back up).
            This takes the rest of the day, and we settle in for the evening

          - We set off the next day (after sorting through the boxes) to Faelar's side quest, which requires
            us to back track to Conyberry.

  - title: A Banshee's Boon
    scenes:
      - summary: "Session 56"
        sessions: [ 56 ]
        start: 14th/15th/16th/17th Leaffall
        end: 14th/15th/16th/17th Leaffall
        location: TODO
        story: |
          - Head back to Conyberry
          - Landan tries to locate some wolfsbane variant

          - As we enter the forest, we find a "path". As we proceed, the forest turns

          - Find a domed shelter made by the wrapped fallen branches of nearby trees
          - There's a door way in the side of these

          - Faelar looks to see if there's anyone inside doesn't see anyone, so he proceeds
            inside is sparsely furnished with old elven craft.
            Faelar asks 'Lady Agatha' if he can enter
            She appears, spectral elf lady appears (drawing even more heat our of the air)
            We get called 'foolish mortals' who seek death by seeking her out.

          - Faelar asks for his boon in exchange for returning an item of Agatha's (a silver comb).
            She accepts it by magically beckoning the comb to her; it was not her's, but it an acceptable
            offering.

          - Question: "I would like to know the location of the spellbook that once belonged to the mage
            known as Balgentle(sp)"
            Answer: Traded to the necromancer Tsernoth of Iriaebor

          - Faelar's summary is "I got a answer to the question I was told to ask".
          - Bael plays around with Glint (known spectre fear-er) by making her think Agatha is in her head.

          - We return to Conyberry and set up camp in a church. Bram has picked a great spot(!!!)
            Glint has made good food(!!!).

          - During the first watch, Glint notices a pair of small beady red eyes on the wall of the chapel
            looking down on us. Glint immediately activates bonfire to light it up, and it falls off the
            wall. It was a racoon!

          - During the second watch, Lash finds the racoon again limping away. As he attempts to kill it for
            some fresh meat, it poofs away as if it is a magical familiar. Lashyn reports this to Faelar,
            who notes that a wizard might be around (or might not be).
            Mid-way through the shifts, the wind picks up.

          - During the third watch, the back wall begins falling over. Landan tries to push it out, and
            shouts in warning, but one end of the wall still crushes Glint and Bram. As Faelar leaps
            up, he notices that the wind has reached a crescendo.
            (there is no fell voice on the air, so it wasn't Saruman)
            Lashyn becomes Big to help move the rocks along with Tik-Garn, and there's a lot of cleaning
            and healing for the squished squishy-cat

          - Glint finds us a new place to rest with braced walls. The braces were installed within the
            last year. The final watch continues to experience gusty winds.

          - The next day, it is pointed out that a limping injury doesn't make sense -- summoned familiars
            should disparate when they take any damage. The hole in the ground has obvious blood, so
            there is more evidence that this was not a familiar. No real conclusions are drawn
            (though the polymorph spell is discussed)

  - title: No Fighting in the War Room
    scenes:
      - summary: "Session 56"
        sessions: [ 56 ]
        start: 14th/15th/16th/17th Leaffall
        end: 14th/15th/16th/17th Leaffall
        location: TODO
        story: |      
          - On the 17th (after 3 days of travel on the Triboar Trail), we return to Phandalin.
            We were last here on High Harvest Tide, 17 days ago.
            The place hasn't burnt to the ground, but we have new visitors!
            The gnomes have arrives; Ula is presumably hear in relation to the new railway and
            the anti-dragon siege weaponry. Zook is here to help set up our garden, in our
            steadily establishing hideout.

          - We have a report from the Merric/Sildar/Gundred group, who went on an adventure to
            the Dwarven Excavation (where they received a pair of sending stones, one of which
            ends up with Faelar).
            They also took up the resupply mission, but upon arrival they found that the place
            had been decimated by a young green dragon and it's associated kobold. This happened
            around 7 days ago.

            Harbin has not been told yet that this happened, or that his brother might be dead.
            We then brief Silidar on:
              - The Blue Dragon
              - The Gulthias tree
              - The Netherese cache
              - Crystella's corpse
              - The Glass weapons and that whole thing with doppelgangers

            Sildar notices that all these problems (which he is putting pins in the map for)
            fill out a roughly 40 mile circle around Phandalin. Definitely no survivorship bias there.
            He also reckons there might be another Talos ritual to be -- it would be in the direction
            of Westbridge.

            Also added to the map is the location we found all of the glass weapons.
            The Glasstaff was working for the Black Spider. There is also the Black Scorpion who
            is working in tangent to the former group.
            The glass weapons were noted as all being assigned to people who were embedded
            into a larger group with the aim of recruit the teams, either for or against
            the Black Spider (it is not clear from the information we have). The one in the
            were-rat cave was however there to collect poisonous reagents, rather than deal
            with the were rats.
            There is factionalism happening! This is all very confusing to a simple
            Kitteh brain.

            Also also added to the pins Wave Echo Cave, the place that Gundren's family
            is at (which we should get to).

          The current plan is to:

          - Message to Thundertree to tell Druid friend about the green dragon and the potential lunberpeeps in need
          - Task Sildar to message to whoever is responsible Westbridge to be on the lookout for Talos
          - Send the goblins to scout Axeholm
          - The part will set out to on the morning of the 18th go to Wave Echo Cave

