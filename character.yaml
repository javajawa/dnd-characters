      - summary: "Session 47"
        sessions: [ 47 ]
        start: 9th Leaffall
        end: 9th Leaffall
        location: TODO
        story: |
          Good news! The fireball destroyed all the clues!! And the books.
          And if the fire keeps spreading, potentially the room.
          This is a fire that was not caused by Glint, and thus is ignored by
          Glint who goes to look at the reading desks -- where she finds a
          book propping up a desk which is glowing. Not with magic, but cut
          within it is a leather pouch containing some magic illusion sand!

          The tree was likely planted at the bottom and has grown up through
