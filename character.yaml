      - summary: "Session 62"
        sessions: [ 62 ]
        start: 18th Leaffall
        end: 18th Leaffall
        location: TODO
        story: |
          Faelar searches the bodies of the fallen, finding some nice shibari rope
          on Curly (the bard/fighter) along with his armour and maul, and
          a bunch of stuff on Snide (the tiefling).
          Faelar takes the thieves tools and the silk rope.

          The brazier in the room has the rune for Acid, (Landan and Lahsyn fail
          to recognise). This element is one we seem to lack access for.
          Bram heads off to the slime we killed shortly after entering the dungeon,
          which we recall being acidic (whilst the rest of us are doing a short
          res). The trip there has no sudden surprises, but the act of scooping
          the acid up is a bit of an ordeal for the Centaur; thankfully only one
          point acid damage occurs.

          During his return (which the journey for which involves many DM dice rolls),
          he hears large amounts of (wooden?) rattling from an unknown direction.
          As it grows louder he breaks into a gallop to return to us. As he returns,
          Lash takes up a guard position, but hears nothing.

          We proceed south toe a 30ft cavern with dwarf and gnome miner reliefs,
          depicting the industrious construction and creation of the cave.
          On the ground there's a large number skeletons -- dwarven, mixed with
          larger races. They're not where the original fell, and are instead spread
          out from the passage of things through the space.
          On the wall are 6 large unlit brass lanterns -- some on ledges, some on things.

          As we attempt to carefully cross the room, with Landan searching to see if
          there might be variant wolfsbane around, we are jumped by a pack of moving
          rocks which behave like some kind of giant terror mosquito, attaching long
          noses onto four of our backs (Lash, Glint, Bram, and Faelar). Tik-Garn manages
          to remove one with fist from Faelar, but can't get at Glint's. Lash removes
          Bram with a glaive side swipe, but can't get his own via a dagger back
          scratch technique. Landan finished them off with a Word of Radiance as a
          area bug zapper.
          The second wave comes out much the same as the first, but finds that the
          green blood in Landan's veins not to it's likely, causing its sudden death.
          Faelar claims the last one with lightning.

          Splintered stone benches and heaps of rubble from partial collapsed ceiling
          amid the ruins are armour and weapon racks 8 corpses 2 of which are ogres
          and 6 smaller creatures (potentially dwarves). As Landan and Faelar look for
          variant wolfsbane, and Lashyn looks for potentially magic weapons, the
          corpses turn out to be Zombies. Thankfully we have our handy cleric ready
          to Turn and Sear Undead which somewhat trivialises this combat. The two
          Orges take a little longer to put down.

