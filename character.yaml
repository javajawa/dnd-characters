  - title: Axeholm
    scenes:
      - summary: Preparations
        sessions: [ 74 ]
        start: 1491-10-24 0800
        end: 1491-10-24 0900
        location: Phandalin

      - summary: -Checking The Quest Board
        sessions: [ 74 ]
        start: 1491-10-24 0800
        end: 1491-10-24 0830
        location: Townmaster's House, Phandalin
        characters: [ Bram, Glint, Faelar, Tik-Garn, Adela, Basil ]
        story: |
          The next morning we get ready to review priorities and ensure that
          tasks are being completed. We were originally planning to head back
          north to look at the Logging Camp's slavers and Green Dragon followers,
          but are reminded that the quest to clear Axeholm, an abandoned dwarven
          fortress, so it can be used as a refuge for the citizens. It represents
          a much more defensible location than Phandalin itself

      - summary: -Visiting the Smithy
        sessions: [ 74 ]
        start: 1491-10-24 0830
        end: 1491-10-24 0900
        location: Alger's Smithy, PhandalinVer
        characters: [ Bram, Glint, Faelar, Tik-Garn, Adela, Basil, Alger ]
        story: |
          Over at the smithy, the wacky designs continue; the giant scythe is
          still unsold, and there is a new creation: a giant cross bow with a guiding
          barrel. Basil's inquiry leads Alger to describe it as a "vial launcher".
          This device bridges the gap between a crossbow, since, and grenade launcher,
          allowing us to fling rocks and potions at distant targets.
          
          The party sees this as a wonderful way to get some control over a
          flying dragon, but we look into ammunition in the [Barthen's Provisioners|Provisioners].
          
          After confirming we have a source and some stock of useful ammunition,
          we purchase the device.
          
      - summary: -Ammo for an RPG‽
        sessions: [ 74 ]
        start: 1491-10-24 0840
        end: 1491-10-24 0850
        location: Barthen's Provisioners, Phandalin
        characters: [ Bram, Glint, Faelar, Tik-Garn, Adela, Basil, Thandor, Thistle ]
        story: |
          We head over to the [Barthen's Provisioners], where the staff [Thandor] and [Thistle]
          are obviously nervous and are avoiding open spaces.
          
          The space is a little disorganised, but we find a vials of oil, acid,
          and alchemist's fire. We already have some acid in our packs from the
          experimental gear found in the [Cragmaw Hideout] from when we rescued
          [Landan].

      - summary: Journey to Axeholm
        sessions: [ 74 ]
        start: 1491-10-24 0900
        end: 1491-10-24 1700
        location: Sword Coast
        characters: [ Bram, Glint, Faelar, Tik-Garn, Adela, Basil ]
        story: |
          The journey to [Axeholm] is uneventful; we deviate slightly
          to [Umbrage Hill] to see [Adabra Gwynn]'s windmill.
          It is very much destroyed, with the stonework strewn across
          the area. We pause every so briefly to see if there is anything
          recoverable, but quickly realise we have neither the time
          or tools.

      - summary: Arrival at Axeholm
        sessions: [ 74 ]
        start: 1491-10-24 1700
        end: 1491-10-24 1730
        location: Axeholm
        characters: [ Bram, Glint, Faelar, Tik-Garn, Adela, Basil ]
        story: |
          A full day of hiking later, we reach the foothills of the [Sword Mountains].
          Thrust out from the base the mountain is the entrance to the
          [Axeholm|dwarven fortress]: a dark, 15ft-wide passageway flanked by 40ft
          bulwarks of seamless stone. An iron portcullis covered with rust blocks the entrance.
          Arrow slits carved into the bulwarks are dark, revealing no hint of occupation.
          
          [Faelar] uses Magic Eye to scout inside, exploring the interior.
          There is quite a large internal area; the gatehouse area being heavily
          defended with a large number of crew-served ballistas, most facing outwards,
          but the defences are also configured to consider the possibility of the
          gateway being successfully breached and the defenders getting flanked.
          Above the gateway stand more defenses, including the pots and slots for
          pouring boiling oil and the like.
          
          At the back of the gateway is a double storey room, forming the main hall
          of the complex. This great hall has a 40-foot-high ceiling supported by
          four thick stone pillars. A thick layer of dust covers the flagstone floor.
          There are arrow slots point in from both the north and south ends of this room.
          
          Around the great hall and gatehouse areas, the main doors are all closed,
          giving less access to the magic eye. However, by going the upstairs
          arrow slits, Faelar is able to guide it around to the into the upstairs
          corridor. This corridor is haunted by the luminous, wispy form of a female elf.
          She floats in the dusty hallway, its face wreathed in a tangle of
          gossamer hair, clad in spectral rags.
          
          In the south east corner of the corridor, a small staircase leads down
          into a partially collapsed shrine as evidenced by wall carvings that
          depict dwarves carrying censers and observing religious rites.
          The eastern side of the fortress appears to have suffered major
          damage during an earthquake -- either the cause of the evacuation,
          or in the time since. This leaves the shrine room an interesting mix
          of rubble, gnawed dwarven bones and a pack of ghouls.
          
          The eastern side of the fortress has little more of note, other than
          winding, rubble-strewn tunnel connecting the upper and lower levels.
          
          Crossing back over, Faelar finds routes into a few more spaces,
          although we know his coverage is now comprehensive. Along with
          various other groups of ghouls, the eye locates the throne room.
          Hiding behind the throne is a ghoul who was apparently turned as
          one of the nobles or stewards of the fort. This ghoul carries a
          magical gauntlet and hand-axe, as evidenced by the lack of corrosion.

      - summary: Breaching the Gatehouse
        sessions: [ 74 ]
        start: 1491-10-24 1700
        end: 1491-10-24 1715
        location: Axeholm
        characters: [ Glint, Faelar, Adela ]
        story: |
          With the scouting complete, and Glint carefully informed about the
          presence of a ghost, we look for how to get the party inside.
          A party with smaller members might be able to slip in, but out group
          are not known to be smol. The iron portcullis is too lage and strong
          to shatter, and so Faelar and Glint enter via misty step.
          
          Locating the winches for the portcullis is easy enough; however the
          mechanisms have not been maintained since the fall of the fortress,
          and casters are not known to be the most buff. The first attempts to
          move are unsuccessful, leading [Marcella] to give support in the form
          of stern advice and timed coordination. The second attempt is able
          to raise (and lock) the portcullis 10 feet up -- enough clearance
          for the party to enter the corridor down to a thick wooden door with
          iron reinforcements.
          
          The batteries housing both the ballistas and winches are (naturally)
          not directly connected to the corridor, not immeidately to the door.
          Neither [Glint] nor [Faelar] wish to explore the ghoulish corridors
          alone, so teleport back into the main corridor, after it has been
          inspected for traps. [Basil] and [Marcella] prepare to open the door,
          only to find it thoroughly barred.
          
          Before conversations on this matter are concluded, [Adela]
          initiates her standard hostile entrance playbook and hurls two
          shatters at the door, breaking it down into (additional) rubble.
          The tooling and materials to rebuild it will not come cheap, but
          no-one has fully explained the purpose of the mission to [Adela]
          who believes it is exploring for magic or knowledge rather than
          building a refuge.
          
          The party (finally) enters the complex, to be greater by all the
          ghouls a-gathering.

      - summary: A Storm of Ghouls
        sessions: [ 74 ]
        start: 1491-10-24 1700
        end: 1491-10-24 1715
        location: Axeholm
        characters: [ Bram, Glint, Faelar, Tik-Garn, Adela, Basil ]
        story: | 
          Blasting their way in through the front door, the party is greeted
          by a wave of ghouls running towards the incoming sound. [Faelar]
          leads with fireball before [Tik-Garn] took up position on the point,
          taking a couple of ghouls down in process. [Bram] breaks out a
          new technique in the form of Crusader's Mantle.
          That positioning causes the ghouls to bunch up, and [Adela] gets
          off another shatter which takes down 11 in one shot, and it is
          less than 30 seconds to the door falling in to the great hall
          being secured.

      - summary: Exploring Axeholm
        sessions: [ 75 ]
        start: 1491-10-24 1715
        location: Axeholm
        characters: [ Bram, Glint, Faelar, Tik-Garn, Adela, Basil ]


