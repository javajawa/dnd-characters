      - summary: "Session 36"
        sessions: [ 36 ]
        start: HHT; 1st, 2nd, 3rd Leaffall
        end: HHT; 1st, 2nd, 3rd Leaffall
        location: TODO
        story: |
          It's big feast time! Who's not here? Town Master Harbin, Helena of the Miner's exchange,
          and the dwarf who runs the Sleeping Giant. Otherwise all named NPCs are present.
          Adabra has arrived with some tasty drinks. Bram (and Glint) put on a show for the kids.

          Glint gives an offering at the shrine of luck and gets a spontaneously coin -- possibly
          a sign from Tymora.

          Bram takes food to the town master, and probably gets the best look any of us have had of him.
          It did not gain us any specific information.

          The manor has been reclaimed by the Lord's Alliance, and we have a couple of rooms

          Light's dreams are the vision from the service, played over and over but with tiny
          variations.

  - title: Race to Thundertree
    scenes:
      - summary: "Session 36"
        sessions: [ 36 ]
        start: 1st Leaffall
        end: 3rd Leaffall
        location: TODO
        story: |
          Reincarnation happens...and Gundren returns as a wonderful slime person!
          At the same time, Qelline receives a sending message from Thundertree -- Reidoth
          is pinned down in their hut (with Yeemik).

          Slime!Gundren wants to proceed to Wave-Echo Cave in order to get ahead of any danger
          to his brothers. We leave a map (which?) with him to annotate with Wave Echo Cave.

          Everything is fine.

          Bram grabs his freshly made horse shoes. The first day of zoomy travel North is uneventual.
          On the second we intercept a returning scout goblin (the one who was with Yeemik) heading
          south. We gave her food and water and let her carry on. We send a sending _to_ Yeemik.

          On the third day, we arrive. Thena scouting reveals one standing structure, with
          cultists around so -- we sneak in (successfully) and engage in combat with some interesting
          draconic cultists who explode upon death with various effects.
          Despite the complete lack of planning, the combat goes surprisingly well!

      - summary: "Session 37"
        sessions: [ 37 ]
        start: 3rd Leaffall, Afternoon
        end: 3rd Leaffall, Afternoon
        location: TODO
        story: |
          Combat continues! We have now all learnt to not kill these things in melee if we can avoid
          it, but we're not great at avoiding. We clear up ok, and get Reidoth to let us inside.

          Yeemik is missing an arm and is exhausted, curled up on some old clothes.
          They've had food but limited water and rest.

          Reidoth tells us that the guardian we was negotiating with was killed.
          "green divine lizard" + "guardian" => we've got an Emerald Dragon called Crystella.
          Or, we did and she has now been killed.

          The "cultists" were ex-humanoids that became draconic by doing
          something with the Emerald's dragon scales (and (presumably) it's power).
          Some more investigation seems to indicate that Drippingfang lead the people to take
          Crystella. We have been told that not only were they taking things from Crystella's
          corpse, they were also leaving/adding something, which might be dangerous.

          Reidoth has a convenient local map with knowledge of the still standing buildings.
          We're also made aware of there having been both zombies and twig blights.
          The opposing leader is going to be coloured purple. Good to know! Also, they were
          and probably still are casters!

          https://cdn.discordapp.com/attachments/969993077638971442/1165343092635877386/637707682427270029.png?ex=65468154&is=65340c54&hm=380f142aebd51fca0caa5c8ee7fe629adb138534a461893b6bd7e5daa38ef63b

          Draconians are made by humanoids grafting bits of dying dragon into themselves.
          This information, combined with the symbol, we have identified this as being a
          (splinter) cell of The Cult of the Dragon, who are dedicated to bringing Tiamat
          back to the material plane.

          https://cdn.discordapp.com/attachments/969993077638971442/1165344436826423357/latest.png?ex=65468294&is=65340d94&hm=d333a5a5acacee52f85c6b5ae94b98e32589d29f8f825703f40f38f19c5a274e

          So, to summarise, we have probably around 10 hostile Draconians, an unknown number of
          zombies, and a potentially trapped dragon corpse, traps left by the creatures eeking out
          a living here for the last 30 years, and the formation of a base of operations for
          the cult of the dragon.

          The plan comes together during a short rest: the injured will remaining in this tested
          house, whilst we clear out the remaining cultists. We consider trying to set different
          groups in the area against each other, specifically trying to appear as liberators to
          the twig blights.

          An aside on Twig Blights:
          > Twig blights can root in soil, which they do when living prey are scarce.
          > While rooted, they resemble woody shrubs.
          > When it pulls its roots free of the ground to move, a twig blight’s branches
          > twist together to form a humanoid-looking body with a head and limbs.
          > Twig blights seek out campsites and watering holes, rooting there to set
          > up ambushes for potential victims coming to drink or rest.
          > Huddled together in groups, twig blights blend in with an area’s natural
          > vegetation or with piles of debris or firewood.
          > Given how dry they are, twig blights are particularly susceptible to fire.

          We (eventually, in player time) head out to scout and isolate and eliminate groups.
          Light is taking the lead and looking out...mostly for creatures, but also trying
          to avoid places where traps would obviously be. Disappointingly, on the second
          building Light pokes their head over a broken wall, finds some hostiles...but the
          stealth check of 18 doesn't beat the perception of 19 from inside. The two draconians
          inside come out, plus a third that glides down from a nearby tree in stealth mode.
          We immediately find ourselves grouped up due to the terrain and the sudden
          pincer maneuver. A fourth one glides in on round 2, and we try to keep them not
          close to too many of us. On the plus side, actual damage taken is pretty low.
          The two yellows do the petrification thing, the second black self-explodes,
          but we get out of the fight with some resources used but not that worse for wear.

          Also spotted inside the old general store is a humanoid corpse bound or wrapped,
          potentially in the sense of a zombie. It has been dead for an short-to-indeterminate
          amount of time.

      - summary: "Session 38"
        sessions: [ 38 ]
        start: 3rd Leaffall, Afternoon
