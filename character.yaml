  - title: Remember the Lodge!
    scenes:
      - summary: "Session 50"
        sessions: [ 50 ]
        start: 9th/10th Leaffall
        end: 9th/10th Leaffall
        location: TODO
        story: |
          We set off in the direction of the hunting lodge, as a Cryovain flies over
          us off to the east. Faelar notices that she is growing at an accelerated
          rate (which I hope he will remember to tell us later) -- around 50 years
          in a little over 20 days.

          The lodge itself appears abandoned -- Falcon is barricade up in a stone
          along with the 4 humanoids in one of the stone buildings, and Xanth managed
          to hide in the smithy.

          Dinner is cooked (Light started and the official cook steadily kicked them
          out). We get rewards for the quest (Boots of Elvenkind), and Light debriefs
          some of the lodge people about what was found at the manse, ending with
          their intent to travel back to their old Abbey to bring assistance to
          clear the Gulthias tree.

          We sleep (with watches) in the conveniently placed watch tower;
          Falcon's family are in the "basement" (windowless door-less bottom floor
          of the tower) playing 'hide from Basil' (who will seek them in the morning).

          As we settle down for the night, we get the chance to discuss Cyrovain.
          The party pulls together enough information to conclude that:
           - Cryovain is getting physically older
           - She is probably an adult now
           - Based on the rate of aging, she's still a year from Ancient
           - She's not maturing mentally, going by her behaviour today
           - Aging is not known dragon magic, but this definitely looks magical
           - Some kinds of ghost have the power to age living things
           - Overall Cyrovain status: aggressive, wild, triackable?, dangerous.

          The third watch is Light and Faelar; Faelar says he could send a message
          to the Abbey rather than having them make the long walk.

          As the dawn comes, a new magical storm starts brewing.
          As it starts thickening, the rest of the party is woken up
          ready for whatever is coming.
          One large lightning strike comes as we finishing getting ready
          as a giant lightning boar crashes through the palisade wall,
          backed up by a force of orcs and half-orcs.

