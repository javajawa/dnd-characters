  - title: High Harvest Tide
    scenes:
      - summary: "Session 35"
        sessions: [ 35 ]
        start: The Fading, 29th/30th; HHT
        end: The Fading, 29th/30th; HHT
        location: TODO
        story: |
          We depart Cragmaw and being to make camp when barking is heard in the distance.

          Bram's Dream: Tiamat is being angry at person A; person B takes damage. And teaches Bram this power (happy birthday SJ).

          The next morning, shortly after we leave camp, we come across a bloody scene with one or more missing carcasses
          where there is a mess of blood of entrails. Signs of multiple canines and at least 8 humanoids set of footprints.

          - Travel! not a lot happens
