  - title: Neverwinter Day Trip
    scenes:
      - summary: "Session 41"
        sessions: [ 41 ]
        start: 4th/5th Leaffall
        end: 4th/5th Leaffall
        location: TODO
        story: |
          - The party except Landan heads off to Neverwinter
          - Landan (escorted by Yeemik and Reidoth) head into the tower, and are able to dispel one of
            the eggs, but the other dispels don't take (spell level too high).

          A couple of above table things happen with Kitteh getting very confused
          about their new features, and delayed roll for dragon happening,
          and Randus is having the surprise. Who knows what _that_ means.

          As we take entry into Neverwinter, we pass under a large gate and spot
          a massive poster of "Lord Neverember promising great reward to anyone who
          can defeat the Dragon Cyrovain.". Those who are familiar notice that
          Neverwinter is quieter that usual, and the southern city walls look damaged
          (and repairs are underway on the Southern wall).
          That's...surely good news! We've already got that quest! Not much progress on it.

          Slightly more concerning that Cyrovain has been up here and caused noticeable
          damage, which Glint confirms by asking the nearby guard (who seems very
          surprised that we don't know what's going on). Apparently the Stone-Cold Reavers
          (a major mercenary/adventuring group) have got involved and are looking to
          take her down. Oh, and the use of "her", that really surprises the guard.
          Without having loyal kobolds to talk to, they hadn't got that bit, and so
          are a little suspicious of Glint. She managed to shift that off by explaining
          about the kobolds and giving them the wanted poster for Frigidfang.
          The guard suddenly has to act as a runner to the mythical Eychkyue (HQ)
          after calling out a random boy from the wall to watch the post.

          Our place of residence for the evening is the South Gate Inn. Behind the counter
          is an older wood elf, who works through an actual booking book for the rooms.
          The rooms, up on the third floor, are _pricy_ at 7sp a person (not room) and
          only just including a meal. (Bram/Glint room 303; Light/Jalorda 306; Faelar 307).

          Light gets: Room Key.

          [Bram's Story]

          Bram is hunting for the temple of Bahamut in the city, the bartender (an earth
          Gineuss) who sends them in the general direction of the Halls of Justice.
          There's no Centaurs on the street, but they are in general very quiet.

          As he approaches the Halls of Justice (a templex complex dedicated to Tyr),
          and is halted by a bulky looking acolyte. That acolyte is _very helpful_
          in explaining that there aren't temples to Bahamut in general, and is
          unable to help with where they meet -- however, the paladins of Bahamut
          tend to drop by the halls, so a message will eventually be disseminated.

          Information about the dragons is exchanged, and information about the Cult
          of the Dragon sect / cell is also passed over. There was a previous incident
          with "rambunctious individuals" heading East along the river, which might
          be directly related.

          History fact: Lord Neverember recently yielded back to the priesthood of Tyr
          after Tyr returned from the dead; it had been the palatial complex for a while.

          Bram moves on to trying to find a farrier/blacksmith, and does some "scouting"
          of potential establishments and gets called out for doing so and gets to learn
          that there is a herd staying in the Neverwinter Woods. With this information
          giving a new possibility, Bram immediately stops trying to find a non-Centaur
          they

          [Jalorda's Story]

          Zvothur is not present to have their adventure. (But we know he goes to the

          [Faelar's Story]

          Faelar elects to ask the innkeeper for his directions, and gets directed
          to the bookshop "like 3 blocks in that direction". It's dusty and has...
          lots of books. The gnome who runs it seems to be very excited about the
          idea of a customer, but doesn't seem to have any idea of what stock contains,
          what a book sorting system looks like, or how to look after a bookshop.

          The actual owner is her grandmother, who is getting on in years and
          "is probably asleep".

           - "Devils, Demons, and how to tell them apart"
           - "What to expect when your expecting...an attack around every corner"
           - "101 ways to cook monster meat and how to ensure it won't kill you first"

          The sale price is not very expensive 15gp per book, and the 45gp is added
          to the chest, which doesn't look like it contained that much money otherwise.
          The chest in under the table, and the key is just behind her, so it's an easy
          mark for a party that is into that sort of thing.

          Faelar does not, apparently, have a secret thing to do.

          He does however see Jalorda conversing with a gnome at the Hall of Knowledge,
          but doesn't work out what about. Faelar goes looking for information on what
          is going on with Dracolichs and Crystella's body.
          The traditional creation process starts with a dragon itself trying to conquer
          death, and their presence is often connected with the Cult of the Dragon.
          The papers theorise that the Cult knows how to help and/or push dragons into
          the process, and that there is a "minimum age" style effect where a dragon
          that is too young will not survive the process.

          Additionally, there is evidence (but no proven facts) that a dragon
          that fails the liching process, the result can be a different abomination.
          The result is that a bone dragon like creature is created from the corpse.
          This process is not immediate, and the mechanisms are not well known.

          These notes include some diagrams of dragon skeletons.
          It also included notes on Ghost Dragons (spirits), Death Dragons (skeletal
          dragons)...and Hollow Dragons.

          > Unlike dragons who explore the magic of undeath for power, some metallic
          > dragons see undeath as a means to pursue a noble purpose. For the sake of
          > protecting an artifact or fulfilling an oath, a dragon might transform
          > into a hollow dragon, accepting undeath until that purpose is fulfilled.

          [Light and Glint's Story]

          Bram has entrusted Light and Glint with 250GP for their shopping trip.
          The upside of the dragon problems is that there's no cut purses out and
          about. The problem with a dragon attack is that no-one has any potions
          left. Glint is eventually able to find the one shop that still has some
          called Potions and Poultices, which is run by a Leonin (we eventually
          learn his name is Antonio).

          The chest of remaining potions, which only contains three potions.
          The city guard requisitioned many potions, and the Reavers brought almost
          all of the rest of them. The markup is merely 10% (which, frankly, is fair).

          Ruling: The party can not have two dads, even one cat dad and one horse dad. :(

          We start discussing other things, including some potted nightshade. As he
          goes to check the back, he actually splits into two with one going into the
          back. This is determined to be real cool. He returns with a saproling and
          50gp of pre-shredded material. Based on this, and some insight checks,
          Light decides to trust the Leonin to ask about the wolfsbane variant.

          This leads to the concept of commission for getting hold of the wolfsbane
          and how to get it to the party. Light definitely doesn't ramble endless
          list of all delivery options. After he recovers from this, we learn that
          this is Antonio. The overall conversation is causing a lot of interest
          in what the heck.

          [Back at the Inn]

          The books are shared -- is Antonio actually a Rakshasa? It could be.
          Beyond that, nothing revelatory in there, but we do now have an everything
          cookbook.

          [The Next Day]

          Landan is able on the second attempt to dispell the second egg. Unfortunately
          he fails this con save and gets a little poisoned. In the remains of the shell
          is some amount of bodies with some dragon grafting that has happened.

          After the poison clears, Landan settles down to spend some time casting
          Locate Animals or Plants to try and find some Wolfsbane.

          There is a lot of conversation around how many potions to buy on the return
          trip to Antonio's shop, and we eventually pick up some anti-toxins and a
          lightening resistence potion. He also takes a moment to update the branding
          on the store to include the "Antonio's" (Glint approves).

          On the exit from the city, Bram informs the city guard about the draconian
          activity (and that we think we have solved the problem).

          As we return to Thundertree, we encounter the reinforcement goblins
          (who are exhausted). Back in town, we realise we still don't know exactly
          know what to do about the dragon corpse. We determine that dispelling it
          probably won't do a lot...but a quick Augury shows that leaving the corpse
          as-is is a _really_ bad idea. The attempt to dispell does indeed do nothing,
          and gentle repose is recast for safety.

          We settle in for the night to give the Goblins time to recover some energy,
          and we prepare for Zombat (zombie combat).

