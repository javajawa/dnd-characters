          "If it was going to hatch, it hasn't yet." -- Light (except it totally could).

          The body is ignored, the party regroups and attempts to stealth towards the
          next building. As we approach...zombies stagger out! The fight is confused by
          appearing dragonbois (the stealthy purple acid bois again). Overall, the combat
          is pretty simple.

          [Kitteh departs due to random pains~~]

          - "we all tried to not breath in zombie"
          - glint thinks the cacoon is magical, goes to stab it, fails
          - sends mint in to eat the sticky thread

