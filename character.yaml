  - title: Crossing Neverwinter Woods
    scenes:
      - summary: "Session 45"
        sessions: [ 45 ]
        start: 8th/9th Leaffall
        end: 8th/9th Leaffall
        location: TODO
        story: |
          Confronted by a river we can not cross, we press south in the direction of
          Falcon's Hunting Lodge. A little while latter it appears out of the fog, a
          fortified position just across the river -- a two storey stone and wood
          building, surrounded by a 10 foot wooden palisade. The main entrance
          is cleverly positioned as across the bridge river, with some paths out the
          other side.

          We ring the bell (which is very loud) and are greeted by a very well-spoken
          kobold servant by the name of Corwin. He is happy to welcome in adventures
          answering the call, and are invited to join them for dinner in the main
          hall. We stable the horses (and our wild centaur friend), and join the table
          for dinner.

          The table is surprisingly busy. It's headed by Falcon (that's his name,
          apparently), along with his two...adopted kids? They're a pair of young
          tieflings who we will latest identify as Pell and Rat. For the guests there
          is we have the half-elf lord Robert Downy and his buff blue dragonborn
          servant / bodyguard. The final member present is a drow adventurer
          Basil Lestrade.

          <img src="https://cdn.discordapp.com/attachments/969993077638971442/1211010176065478726/image-160.png?ex=65eca41d&is=65da2f1d&hm=3379db223939cfceca5ac2ca63b78e2a2920c9b2e52ae848a33dcde15ea15b72" />

          Dinner is served. Pell eats a little weird; we later learn he's mute due to no tongue.
          At the time Light just kind of passes up the thought that the method of eating
          is a bit off.
          Rat is sitting next to Glint and is introduced to Mint, and gets to (nervously)
          give them a bone as a treat.

          Conversation at the table turns to practical things; Lord Downy wishes to go
          hunting, but Falcon notes that it's not safe what with the orcs and the dragon.
          Downy is relocated to his fancy living chambers. (Treefeller presumable
          also leaves at this time -- the next we see him is on a cot in the servants
          section / non-noble guestroom).
          We learn that a dragon has been here multiple times over the last month, and
          Falcon learns that "which dragon?" is apparently a relevant question.

          During this part of the conversation, where the party offers to head out
          to deal with the half-orc menace, we get to know Basil a little better.
          By which we mean that Glint and Basil are talking and everyone else is
          praying that they don't decide to start an offshoot of the Rakdos cult
          (well at least the one person who knows what that means).

          Basil is armed with weapons, magic items, an a deck of cards. The weapons
          do include the moon blades that were on sale in Phadalin, a detail that
          Glint picks up on early; interestingly, neither side has run into the other
          in person or by reputation. The deck of cards is used for a practical magic
          trick; even Light is unable to track how they pull that one off, and they
          were looking to get a better understanding.
          Light attempts to be silly by turning invisible when the intro of Bram
          is foll;owed up with "who wishes to not be perceived").

          The next thing that is incomprehensible is the game of 'pass the Hat'.
          The "unidentified" hat (some of us realise that Basil always knew) doesn't
          fit on kitty heads, sort of fits on centaur head, and Tik-Garn takes a
          change to try their newly found illusion powers (with an offer of help from
          Glint for getting the hang of it). The hat turns out to be a cap of awareness
          for an elvish blade-singer. Basil attempts to claim they got it in Phadalin
          (we have never seen it for sale or knew who'd they would have brought it
          from, and the entire thought appears to be a lie. This gets them added to
          Light's spider web of conspiracies (aka things Light does not understand)
          as someone who has really conveniently appeared looking to give away a magic
          item that we would have been interested in but never saw, is working with
          the blade-singer who is staying the in haunted house of Sister Graelae,
          and the general presence of hostile action that surrounds people coming and
          going into Phandalin.

          Falcon retires as soon as is prudent (the kids left upon finishing eating
          their food), and we had to the guest / non-noble quarters shortly after.
          Not a lot is said in session about the conversation, but we've just acquired
          a new friend and we still have the novelty of a Ravnican around and willing
          to answer questions.

