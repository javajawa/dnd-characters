name: Boots of Elvenkind
link: https://www.dndbeyond.com/magic-items/4587-boots-of-elvenkind
equippable: true
description: |-
  While you wear these boots, your steps make no sound,
  regardless of the surface you are moving across.
  You also have advantage on Dexterity (Stealth) checks that rely on moving silently.
